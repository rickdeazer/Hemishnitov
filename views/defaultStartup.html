    <style>
@import url('https://fonts.googleapis.com/css2?family=Akronim&family=Kranky&family=Lora:ital,wght@0,400..700;1,400..700&family=Offside&family=Oleo+Script:wght@400;700&family=Rubik+Scribble&family=Rubik+Wet+Paint&family=Stack+Sans+Notch:wght@200..700&family=Trade+Winds&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap');
        body{
            overflow:hidden;
            padding: 0;
            margin: 0;
            background-color: rgb(35, 2, 10);
        }
    .wrapper{
        transform-style: preserve-3d;
        perspective: 1;
        position: absolute;
        width: 40vw;
        height: 40vw;
        align-self: center;
        top: 30vh;
        justify-self: center;
        display: flex;
        justify-content: center;
        scale: 1;
        background-color:rgba(49, 1, 1, 0);
        border-radius: 50%;
        align-items: center;
        border: solid 1px rgba(33, 1, 1, 0.859);
        animation: 3s rotas ease infinite;
        outline-offset: 2px;
    }
    @keyframes rotas {
        0%{}
        50%{transform: rotateY(360deg) rotateZ(180deg);background-color: rgba(40, 1, 1, 0);border-width: 2px;border-radius: 40%;}
        75%{transform: rotateZ(360deg);scale: 1.5;}
        80%{background-color: rgba(33, 1, 1, 0.859);}
        90%{}
        100%{}
    }
    .wrapper div{
        width: 60px;
        position: fixed;
        height: 60px;
        background:linear-gradient(black,rgba(131, 3, 3, 0.326));
        margin: 0;
        padding: 0;
        animation: bradius 3s ease infinite;
        border: solid 0px rgba(255, 255, 255, 0.008);
        
    }
    @keyframes bradius {
        0%{}      
        48%{border-radius: 0%; outline:none;}  
        49%{}
        50%{border-radius: 50%; scale: 1; background-color: rgba(1, 255, 39, 0.537);border: solid 0px rgba(237, 190, 231, 0); outline: solid 0px rgba(255, 255, 255, 0.495);}
        75%{scale:1.5;background-color: rgba(255, 6, 197, 0.418); border: solid 0px rgb(255, 255, 255);scale: 1.5;outline: solid 1px rgba(255, 255, 255, 0.389); outline-offset: 3px;}
        98%{boder: solid 0px rgba(255, 255, 255, 0.721);
        border-radius: 50%;}
        100%{}
    }
    .maindiv{
        background-color: rgba(255, 255, 255, 0.788);
        height: 120vw;
        width: 95vw;
        justify-self: center;
        margin-top: 60px;
        border-radius: 25%;
        border-bottom-right-radius: 50%;
        border-bottom-left-radius: 50%;
        border-top: solid 1px rgba(28, 200, 22, 0.341);
        align-self: center;
    }
    .a{
        background-color: red;
        transform:translateZ(-30px);
        text-align: center;
        align-content: center;
        font-size: x-large; }
    .b{
        background-color: green;
        transform:translateZ(30px);
        text-align: center;
        align-content: center;
        font-size: x-large;
    }
    .c{
        background-color: blue;
        transform: rotateX(90deg) translateZ(30px);
    }
    .d{
        background-color: black;
        transform: rotateY(90deg) translateZ(30px);
    }
    .e{
        background-color: brown;
        transform: rotateX(90deg) translateZ(-30px);
    }
    .f{
        background-color: purple;
        transform: rotateY(90deg) translatez(-30px)}
        .x{
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: 100vw;
        }
    h1{
        height: 30px;
        text-align: center;
        margin: 0;
        font-size: xx-large;
        font-family: Rubik Scribble;
        padding: 5px;
    }
    #a{
        color: rgb(92, 92, 255);
        border-bottom: solid 2.5px white;
        border-bottom-left-radius: 4px;
    }
    #b{
        color: rgb(195, 208, 5);
        border-bottom: solid 2.5px white;
    }
    #c{

        border-bottom: solid 2.5px white;
    }
    #d{
        color: green;
        border-bottom: solid 2.5px white;
        border-bottom-right-radius: 4px;
    }
    h2{
        color: rgb(217, 223, 254);
        font-size: small;
        justify-self: center;
        padding-top: 20px;
    }
    h3{
        font-family: lora;
        text-align: center;
        font-family: Akronim;
        letter-spacing: 2px;
        font-weight: lighter;
        font-size: larger;
    }
    span#e{
        color: rgb(92, 92, 255);
    }
    span#f{
        color: rgb(195, 208, 5);
    }
    span#g{

</style>
